# Builds the app and publishes it to GitHub Pages on every push to main.
# The app is then available at https://dawidgorecki.github.io/sprawunki/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab for manual deploys.
  workflow_dispatch:

# Minimum rights needed: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes come quickly, finish the running deploy before starting the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # npm ci installs exactly the versions from package-lock.json.
      - run: npm ci

      # A failing test stops the workflow, so a broken version is never published.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
