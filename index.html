<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: lets CSS use env(safe-area-inset-*) on phones with a notch / home bar.
      interactive-widget=resizes-content: Chrome on Android shrinks the page when the keyboard
      opens, so the bottom bar stays visible above the keyboard instead of hiding behind it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Sprawunki</title>
    <!-- Browser UI color (e.g. Android status bar), matching --color-bg in both themes. -->
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <!-- Paths starting with / get the /sprawunki/ base added by Vite. -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- iOS ignores manifest icons and uses this one for "Add to Home Screen". -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-title">
        <h1>Sprawunki</h1>
        <!-- Opens the list picker below (spec 11.2). Hidden by list-picker.js while there is only one list. -->
        <button type="button" id="open-list-picker" aria-haspopup="dialog" hidden>
          <span class="list-picker-name"></span>
          <span aria-hidden="true">▾</span>
        </button>
        <p id="progress" hidden></p>
      </div>
      <!-- Opens the lists dialog below (spec 11.3). Always shown: it is the only way to add a list. -->
      <button
        type="button"
        id="open-lists"
        class="header-button"
        aria-label="Listy"
        title="Listy"
        aria-haspopup="dialog"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M9 6h11M9 12h11M9 18h11" />
          <circle cx="4.5" cy="6" r="1" />
          <circle cx="4.5" cy="12" r="1" />
          <circle cx="4.5" cy="18" r="1" />
        </svg>
      </button>
      <!-- Opens the categories dialog below (spec 10.5). -->
      <button
        type="button"
        id="open-categories"
        class="header-button"
        aria-label="Kategorie"
        title="Kategorie"
        aria-haspopup="dialog"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z" />
          <circle cx="7" cy="7" r="1.5" />
        </svg>
      </button>
      <!-- Shown by main.js only when the browser supports the Wake Lock API (spec 9.3). -->
      <button
        type="button"
        id="wake-lock"
        class="header-button"
        aria-label="Nie wygaszaj ekranu"
        title="Nie wygaszaj ekranu"
        aria-pressed="false"
        hidden
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
          />
        </svg>
      </button>
    </header>

    <main>
      <p id="empty-state" hidden>Lista jest pusta. Dopisz pierwszy produkt poniżej.</p>

      <section id="to-buy-section" hidden>
        <h2>Do kupienia</h2>
        <!-- One <ul> per category, each with its heading (spec 10.3); filled by ui.js. -->
        <div id="to-buy-groups"></div>
        <!-- Read by screen readers as the description of every reorder handle (aria-describedby). -->
        <p id="move-hint" hidden>Strzałki w górę i w dół przesuwają produkt.</p>
      </section>

      <section id="bought-section" hidden>
        <h2>Kupione</h2>
        <ul id="bought-list"></ul>
        <button type="button" id="clear-checked">Wyczyść kupione</button>
      </section>
    </main>

    <!-- Kept at the bottom of the screen, within thumb reach. -->
    <footer class="bottom-bar">
      <div class="message">
        <!-- Live region: screen readers announce text put here. Kept in the DOM even when empty. -->
        <p id="message-text" role="status"></p>
        <!-- "OK" for messages that stay until closed, "Cofnij" (undo) after removing. -->
        <button type="button" id="message-button" hidden>OK</button>
      </div>
      <form id="add-form">
        <label for="new-item-name" class="visually-hidden">Nazwa produktu</label>
        <input
          id="new-item-name"
          type="text"
          maxlength="100"
          autocomplete="off"
          enterkeyhint="done"
          placeholder="np. mleko 2 l"
        />
        <button type="submit">Dodaj</button>
      </form>
    </footer>

    <!-- Managing categories (spec 10.5); filled and wired by manage-dialog.js. -->
    <dialog id="categories-dialog" class="app-dialog" aria-labelledby="categories-title">
      <!-- Sticks to the top while the dialog scrolls, so "Gotowe" and messages stay in view. -->
      <div class="dialog-header">
        <div class="dialog-title-row">
          <h2 id="categories-title">Kategorie</h2>
          <button type="button" class="dialog-close">Gotowe</button>
        </div>
        <p class="dialog-message" role="status"></p>
      </div>
      <p class="dialog-hint">Kolejność kategorii to kolejność działów na liście zakupów.</p>
      <ul id="category-list" class="manage-list"></ul>
      <form class="manage-form">
        <label for="new-category-name" class="visually-hidden">Nazwa nowej kategorii</label>
        <input
          id="new-category-name"
          type="text"
          maxlength="40"
          autocomplete="off"
          enterkeyhint="done"
          placeholder="Nowa kategoria"
        />
        <!-- Short visible text leaves room for the field on narrow phones. -->
        <button type="submit" aria-label="Dodaj kategorię">Dodaj</button>
      </form>
    </dialog>

    <!-- Managing lists (spec 11.3), built like the categories dialog; filled and wired by manage-dialog.js. -->
    <dialog id="lists-dialog" class="app-dialog" aria-labelledby="lists-title">
      <!-- Sticks to the top while the dialog scrolls, so "Gotowe" and messages stay in view. -->
      <div class="dialog-header">
        <div class="dialog-title-row">
          <h2 id="lists-title">Listy</h2>
          <button type="button" class="dialog-close">Gotowe</button>
        </div>
        <p class="dialog-message" role="status"></p>
      </div>
      <p class="dialog-hint">Kolejność list to kolejność przy wyborze listy.</p>
      <ul id="lists-list" class="manage-list"></ul>
      <form class="manage-form">
        <label for="new-list-name" class="visually-hidden">Nazwa nowej listy</label>
        <input
          id="new-list-name"
          type="text"
          maxlength="40"
          autocomplete="off"
          enterkeyhint="done"
          placeholder="Nowa lista"
        />
        <!-- Short visible text leaves room for the field on narrow phones. -->
        <button type="submit" aria-label="Dodaj listę">Dodaj</button>
      </form>
    </dialog>

    <!-- Switching lists (spec 11.2); filled and wired by list-picker.js. -->
    <dialog id="list-picker" class="app-dialog" aria-labelledby="list-picker-title">
      <div class="dialog-header">
        <div class="dialog-title-row">
          <h2 id="list-picker-title">Wybierz listę</h2>
          <button type="button" class="dialog-close">Zamknij</button>
        </div>
      </div>
      <ul id="list-picker-options"></ul>
    </dialog>

    <!-- Tag icon of the category picker next to every "to buy" item; cloned by ui.js. -->
    <template id="category-icon">
      <svg
        viewBox="0 0 24 24"
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z" />
        <circle cx="7" cy="7" r="1.5" />
      </svg>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
